name: macOS Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and update
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build-macos:
    name: Build universal macOS package
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out update channel
        uses: actions/checkout@v4

      - name: Download validated Desktop Agent source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --pattern "LiveTray-Desktop-Agent-*-source.zip" --dir source
          unzip -q source/LiveTray-Desktop-Agent-*-source.zip -d app

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run release tests
        working-directory: app
        run: npm test

      - name: Build universal DMG and ZIP
        working-directory: app
        run: npm run dist:mac:ci

      - name: Create SHA-256 checksums
        working-directory: app
        run: shasum -a 256 release/LiveTray-macOS-* > release/LiveTray-macOS-SHA256.txt

      - name: Upload macOS files to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" app/release/LiveTray-macOS-*.dmg app/release/LiveTray-macOS-*.zip app/release/LiveTray-macOS-SHA256.txt --repo "${{ github.repository }}" --clobber

      - name: Keep a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: LiveTray-macOS-${{ inputs.tag }}
          path: |
            app/release/LiveTray-macOS-*.dmg
            app/release/LiveTray-macOS-*.zip
            app/release/LiveTray-macOS-SHA256.txt
